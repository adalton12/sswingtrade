version: '3.9'

services:
  # PostgreSQL database for market data, orders, capital tracking
  postgres:
    image: postgres:16-alpine
    container_name: sswingtrade-postgres
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading_dev_pwd
      POSTGRES_DB: sswingtrade
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sswingtrade-net

  # Redis cache for session data and rate limiting
  redis:
    image: redis:7-alpine
    container_name: sswingtrade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sswingtrade-net

  # Ollama for local LLM inference (News Analysis, Event Detection)
  ollama:
    image: ollama/ollama:latest
    container_name: sswingtrade-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sswingtrade-net
    # Note: Run manually after startup: docker exec sswingtrade-ollama ollama pull qwen:3b

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sswingtrade-api
    environment:
      # Application
      APP_ENV: development
      APP_NAME: SSWingTrade
      APP_VERSION: 0.1.0

      # Database
      DATABASE_URL: postgresql://trading:trading_dev_pwd@postgres:5432/sswingtrade

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434

      # Trading Config
      INITIAL_CAPITAL: 500.00
      MONTHLY_DEPOSIT: 500.00
      MAX_DAILY_ALLOCATION: 100.00
      MAX_WEEKLY_CAPITAL: 500.00
      MAX_DAILY_LOSS_PERCENT: 1.5

      # ML Config
      ML_MODEL_PATH: /app/models

      # Logging
      LOG_LEVEL: DEBUG

    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - sswingtrade-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Prometheus metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: sswingtrade-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - sswingtrade-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: sswingtrade-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - sswingtrade-net

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  sswingtrade-net:
    driver: bridge
