# SSWingTrade - stack for running on THIS machine, unattended (paper trading only).
#
#   docker compose up -d --build      first start (builds the API image)
#   docker compose ps                 everything should become "healthy"
#   docker compose logs -f api        follow the application log
#   docker compose down               stop (data is kept)   |   docker compose down -v  => ERASES the database
#
# Secrets come from the .env file next to this file (copy .env.example to .env). Nothing is hard-coded here.
# Ollama is NOT a container: the API talks to the Ollama already installed on this PC (host.docker.internal).

name: sswingtrade

services:
  # ------------------------------------------------------------------ PostgreSQL
  # Plain Postgres: the app does not use TimescaleDB (no hypertables) and the stock image does not ship it.
  postgres:
    image: postgres:16-alpine
    container_name: sswingtrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-sswingtrade}
    ports:
      - "127.0.0.1:5432:5432"          # this PC only (for psql / DBeaver); nothing on the network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sswingtrade-net

  # ------------------------------------------------------------------ Redis (cache only: safe to lose)
  redis:
    image: redis:7-alpine
    container_name: sswingtrade-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is missing - copy .env.example to .env}
    # password required, nothing persisted, capped at 128 MB; no published port (only the API reaches it)
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sswingtrade-net

  # ------------------------------------------------------------------ API + dashboard + scheduler
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: sswingtrade-api:local
    container_name: sswingtrade-api
    restart: unless-stopped
    environment:
      # Application. APP_ENV only changes the console log format (development = readable text, production = JSON)
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_ECHO: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is missing - copy .env.example to .env}

      # Paper trading only. Pinned here on purpose: real trading must never be switched on by a stray .env line.
      ENABLE_PAPER_TRADING: "true"
      ENABLE_REAL_TRADING: "false"

      # Services
      DATABASE_URL: postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sswingtrade}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # LLM: the Ollama already installed on this PC (start it before the 19:30 news job)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}

      # Ollama cloud (optional, empty = off). Only the API container receives the key; it is only sent to ollama.com.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-gemma4:31b}

      # Starting values (everything can be changed later in http://localhost:8000/settings)
      INITIAL_CAPITAL: ${INITIAL_CAPITAL:-500}
      MONTHLY_DEPOSIT: ${MONTHLY_DEPOSIT:-500}
      WEEKLY_DEPOSIT: ${WEEKLY_DEPOSIT:-500}
      MAX_DAILY_LOSS_PERCENT: ${MAX_DAILY_LOSS_PERCENT:-1.5}

      # Files
      ML_MODEL_PATH: /app/models
      LOG_FILE_PATH: /app/logs/sswingtrade.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"          # http://localhost:8000/dashboard  |  /docs  |  /settings
    volumes:
      - ./models:/app/models           # trained ML models survive rebuilds
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sswingtrade-net

  # ------------------------------------------------------------------ Grafana (reads the Postgres directly)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sswingtrade-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is missing - copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # read by docker/grafana/provisioning/datasources/postgres.yml
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sswingtrade}
    ports:
      - "127.0.0.1:3000:3000"          # http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sswingtrade-net

# Prometheus was removed: the API does not expose /metrics yet, so it would only show a "down" target.
# (docker/prometheus/prometheus.yml is kept for when metrics are implemented.)

# Explicit names, different from the previous compose file ("sswingtrade_postgres_data"): a fresh database is
# guaranteed, and an old volume (with old data and an old password) can never be picked up by mistake.
volumes:
  postgres_data:
    name: sswingtrade_pgdata
  grafana_data:
    name: sswingtrade_grafanadata

networks:
  sswingtrade-net:
    driver: bridge
