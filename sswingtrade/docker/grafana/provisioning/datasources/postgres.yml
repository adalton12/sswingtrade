apiVersion: 1
datasources:
  - name: SSWingTrade Postgres
    uid: sswingtrade-pg
    type: postgres
    access: proxy
    url: postgres:5432
    # ${...} is expanded by Grafana from the container environment (set in docker-compose.yml from .env)
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
